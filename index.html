<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Management System</title>
    <link rel="stylesheet" href="style.css">
        <script src="https://kit.fontawesome.com/81babe2812.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="navigation">
        <div class="logo">
            <img src="Glossy Blue Medical Cross Logo.png" alt="">
            <span>CarePoint</span>
        </div>
        <div class="nav-title">
            <div class="head-title">
                <span>Workspace</span>
            </div>
            <div class="head-elements">
                <a href="#">
                    <i class="fa-solid fa-table-cells"></i>
                    Dashboard
                </a>
            </div>
            <div class="head-elements">
                <a href="#">
                    <i class="fa-solid fa-user"></i>
                    Patients
                </a>
            </div>
            <div class="head-elements">
                <a href="#">
                    <i class="fa-solid fa-calendar"></i>
                    Appointments</a>
            </div>
            <div class="head-elements">
                <a href="#">
                    <i class="fa-solid fa-user-doctor"></i>
                    Medical Records</a>
            </div>
            <div class="head-elements">
                <a href="#">
                    <i class="fa-solid fa-calendar-days"></i>
                    Schedules</a>
            </div>
        </div>
        <div class="nav-title">
            <div class="head-title">
                <span>Management</span>
            </div>
            <div class="head-elements">
                <a href="#">
                    <i class="fa-solid fa-user-nurse"></i>
                    Staff & Doctors</a>
            </div>
            <div class="head-elements">
                <a href="#">
                    <i class="fa-solid fa-chart-pie"></i>
                    Reports</a>
            </div>
            <div class="head-elements">
                <a href="#">
                    <i class="fa-solid fa-gear"></i>
                    Settings</a>
            </div>
        </div>
        <div class="nav-title">
            <div class="assist-box">
                <div class="qm">
                    <span>?</span>
                </div>
                <span style="font-weight: bold;">Need Assistance?</span>
                <span style="color: #8f8f8e;">Visit our help center for support with CarePoint</span>
                <a href="#">Visit Help Center &#8599</a>
            </div>
        </div>
    </div>

</body>
</html>
